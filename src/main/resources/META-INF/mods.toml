modLoader = "javafml"
# We can't rely on loaderVersion thanks to early NeoForge using mods.toml
loaderVersion = "*"
issueTrackerURL = "https://github.com/kb-1000/no-telemetry/issues"
license = "MPL 2.0, https://mozilla.org/MPL/2.0/"

[[mixins]]
config = "no-telemetry-neoforge.mixins.json"

[[mods]]
modId = "no_telemetry"
version = "${file.jarVersion}"
displayName = "No Telemetry"
description = "Disable the telemetry introduced in 21w38a"
logoFile = "no-telemetry-icon.png"
logoBlur = false
authors = "kb1000"
displayURL = "https://github.com/kb-1000/no-telemetry"

[[dependencies.no_telemetry]]
modId = "minecraft"
mandatory = true
versionRange = "[26,)"
